<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Better mobile / tablet support -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">

  <title>Voice</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #000;
      overflow: hidden;

      overscroll-behavior: none;
      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: fixed;
      inset: 0;
      background: #000;
    }

    /*
      Entire page is the start button.

      It is visually pure black.
      The user just taps/clicks anywhere once.
    */

    #start {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      border: 0;
      outline: 0;

      appearance: none;
      -webkit-appearance: none;

      background: #000;
      color: transparent;

      cursor: pointer;
    }

    #start.hidden {
      display: none;
    }

    /*
      Keeps the whole screen black even if
      the browser highlights/focuses something.
    */

    * {
      background-color: #000;
    }
  </style>
</head>

<body>

<button
  id="start"
  type="button"
  aria-label="Start microphone"
></button>

<script>
"use strict";

/* ==========================================================
   SETTINGS
   ========================================================== */

const VOICE_FOLDER = "./voice/";

/*
Put the EXACT filenames from your voice folder here.

Supports formats such as:

.mp3
.wav
.ogg
.m4a

Browser support varies by format,
so MP3 is usually the safest.
*/

const voiceFiles = [
  "voice1.mp3",
  "voice2.mp3",
  "voice3.mp3",
  "voice4.mp3"
];


/*
Microphone sensitivity.

Smaller = easier to trigger.
Larger = needs louder sound.

Try:

0.015 = extremely sensitive
0.025 = sensitive
0.035 = normal
0.050 = louder speech
*/

const VOICE_THRESHOLD = 0.03;


/*
The person must be making sound for this long
before it counts as actual speech.

This helps prevent:

keyboard taps
chair noises
small bumps
random microphone noise
*/

const REQUIRED_VOICE_TIME = 120;


/*
Wait 2 seconds after detecting the voice.
*/

const RESPONSE_DELAY = 2000;


/*
How long after the website finishes speaking
before microphone detection activates again.
*/

const AFTER_AUDIO_COOLDOWN = 1200;


/*
Minimum time between triggers.

Helps stop accidental rapid triggering.
*/

const MIN_TRIGGER_GAP = 3000;


/* ==========================================================
   GLOBAL VARIABLES
   ========================================================== */

let audioContext = null;

let analyser = null;
let microphoneSource = null;
let mediaStream = null;

let dataArray = null;

let running = false;
let waitingToReply = false;
let voiceAudioPlaying = false;

let voiceStartedAt = null;
let lastTriggerTime = 0;

let currentAudio = null;

let previousVoiceIndex = -1;

const startButton =
  document.getElementById("start");


/* ==========================================================
   AUDIO CONTEXT SUPPORT
   ========================================================== */

function createAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;

  if (!AudioContextClass) {

    console.error(
      "Web Audio API is not supported on this device."
    );

    return null;
  }

  return new AudioContextClass();
}


/* ==========================================================
   MICROPHONE CONSTRAINTS
   ========================================================== */

function getMicrophoneConstraints() {

  return {

    audio: {

      /*
        These are requests rather than guarantees.
        Browsers/devices that don't support one
        generally ignore it.
      */

      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true,

      channelCount: 1

    },

    video: false
  };
}


/* ==========================================================
   START SYSTEM
   ========================================================== */

async function startSystem() {

  /*
    Disable immediately so double taps don't create
    several microphone streams.
  */

  startButton.disabled = true;

  try {

    /*
      Create audio context from the actual user tap.
      Important for Safari/iOS.
    */

    if (!audioContext) {

      audioContext =
        createAudioContext();
    }

    if (!audioContext) {

      throw new Error(
        "AudioContext unavailable"
      );
    }


    /*
      Resume if mobile browser created it suspended.
    */

    if (
      audioContext.state === "suspended"
    ) {

      await audioContext.resume();
    }


    /*
      Request microphone.
    */

    mediaStream =
      await navigator.mediaDevices.getUserMedia(
        getMicrophoneConstraints()
      );


    setupMicrophone();


    running = true;


    /*
      Hide button after everything succeeds.
    */

    startButton.classList.add("hidden");


    detectionLoop();


    console.log(
      "Voice listener started."
    );

  }

  catch (error) {

    console.error(
      "Could not start microphone:",
      error
    );


    /*
      Let the user tap again after an error.
    */

    startButton.disabled = false;

  }
}


/* ==========================================================
   SET UP MICROPHONE
   ========================================================== */

function setupMicrophone() {

  /*
    Remove an older source if one exists.
  */

  if (microphoneSource) {

    try {
      microphoneSource.disconnect();
    }
    catch (error) {}
  }


  microphoneSource =
    audioContext.createMediaStreamSource(
      mediaStream
    );


  analyser =
    audioContext.createAnalyser();


  /*
    Larger FFT gives stable microphone readings
    across more devices.
  */

  analyser.fftSize = 2048;

  analyser.smoothingTimeConstant = 0.65;


  microphoneSource.connect(analyser);


  dataArray =
    new Uint8Array(
      analyser.fftSize
    );
}


/* ==========================================================
   DETECTION LOOP
   ========================================================== */

function detectionLoop() {

  requestAnimationFrame(
    detectionLoop
  );


  if (!running)
    return;


  if (!analyser)
    return;


  if (waitingToReply)
    return;


  if (voiceAudioPlaying)
    return;


  /*
    Suspended contexts can happen when:
    - phone is locked
    - tab goes into background
    - browser pauses audio
  */

  if (
    audioContext &&
    audioContext.state !== "running"
  ) {

    return;
  }


  analyser.getByteTimeDomainData(
    dataArray
  );


  let sum = 0;


  for (
    let i = 0;
    i < dataArray.length;
    i++
  ) {

    const sample =
      (dataArray[i] - 128) / 128;

    sum +=
      sample * sample;

  }


  const volume =
    Math.sqrt(
      sum / dataArray.length
    );


  checkVoice(volume);
}


/* ==========================================================
   CHECK FOR VOICE
   ========================================================== */

function checkVoice(volume) {

  const now =
    performance.now();


  /*
    Too soon after the previous trigger.
  */

  if (
    now - lastTriggerTime <
    MIN_TRIGGER_GAP
  ) {

    voiceStartedAt = null;

    return;
  }


  if (
    volume >= VOICE_THRESHOLD
  ) {

    /*
      First frame of detected sound.
    */

    if (
      voiceStartedAt === null
    ) {

      voiceStartedAt = now;

      return;
    }


    /*
      Sound continued long enough.
    */

    const voiceLength =
      now - voiceStartedAt;


    if (
      voiceLength >=
      REQUIRED_VOICE_TIME
    ) {

      voiceStartedAt = null;

      detectedVoice();
    }

  }

  else {

    /*
      Sound stopped before it counted
      as actual voice.
    */

    voiceStartedAt = null;
  }
}


/* ==========================================================
   VOICE DETECTED
   ========================================================== */

function detectedVoice() {

  if (waitingToReply)
    return;


  if (voiceAudioPlaying)
    return;


  waitingToReply = true;

  lastTriggerTime =
    performance.now();


  console.log(
    "Voice detected."
  );


  setTimeout(
    async () => {

      /*
        Mobile browsers occasionally suspend
        the context while waiting.
      */

      await ensureAudioRunning();


      playRandomVoice();

    },

    RESPONSE_DELAY
  );
}


/* ==========================================================
   KEEP AUDIO CONTEXT RUNNING
   ========================================================== */

async function ensureAudioRunning() {

  if (!audioContext)
    return;


  if (
    audioContext.state === "suspended"
  ) {

    try {

      await audioContext.resume();

    }

    catch (error) {

      console.warn(
        "Could not resume audio context.",
        error
      );
    }
  }
}


/* ==========================================================
   RANDOM FILE
   ========================================================== */

function getRandomVoice() {

  if (
    voiceFiles.length === 0
  ) {

    return null;
  }


  if (
    voiceFiles.length === 1
  ) {

    previousVoiceIndex = 0;

    return voiceFiles[0];
  }


  let index;


  do {

    index =
      Math.floor(
        Math.random() *
        voiceFiles.length
      );

  }

  while (
    index ===
    previousVoiceIndex
  );


  previousVoiceIndex =
    index;


  return voiceFiles[index];
}


/* ==========================================================
   PLAY RANDOM VOICE
   ========================================================== */

async function playRandomVoice() {

  const filename =
    getRandomVoice();


  if (!filename) {

    console.warn(
      "No voice files configured."
    );

    resetDetection();

    return;
  }


  /*
    Stop an older sound if somehow one exists.
  */

  stopCurrentAudio();


  const url =
    VOICE_FOLDER +
    encodeURIComponent(filename);


  const audio =
    new Audio();


  currentAudio = audio;


  /*
    preload helps desktop + mobile browsers
    begin playback more reliably.
  */

  audio.preload = "auto";


  /*
    Do not loop.
  */

  audio.loop = false;


  /*
    Maximum normal volume.
  */

  audio.volume = 1;


  voiceAudioPlaying = true;


  /*
    Set source last.
  */

  audio.src = url;


  audio.addEventListener(
    "ended",
    audioFinished,
    {
      once: true
    }
  );


  audio.addEventListener(
    "error",
    audioFailed,
    {
      once: true
    }
  );


  try {

    /*
      Safari and Chrome both return promises
      from play() on newer versions.
    */

    const result =
      audio.play();


    if (
      result &&
      typeof result.then === "function"
    ) {

      await result;
    }

  }

  catch (error) {

    console.error(
      "Audio playback failed:",
      error
    );

    audioFailed();
  }
}


/* ==========================================================
   AUDIO FINISHED
   ========================================================== */

function audioFinished() {

  voiceAudioPlaying = false;

  currentAudio = null;


  setTimeout(
    resetDetection,
    AFTER_AUDIO_COOLDOWN
  );
}


/* ==========================================================
   AUDIO FAILED
   ========================================================== */

function audioFailed() {

  voiceAudioPlaying = false;

  currentAudio = null;


  setTimeout(
    resetDetection,
    500
  );
}


/* ==========================================================
   STOP CURRENT AUDIO
   ========================================================== */

function stopCurrentAudio() {

  if (!currentAudio)
    return;


  try {

    currentAudio.pause();

    currentAudio.currentTime = 0;

  }

  catch (error) {}


  currentAudio = null;

  voiceAudioPlaying = false;
}


/* ==========================================================
   RESET DETECTOR
   ========================================================== */

function resetDetection() {

  waitingToReply = false;

  voiceStartedAt = null;

  lastTriggerTime =
    performance.now();
}


/* ==========================================================
   PAGE VISIBILITY SUPPORT
   ========================================================== */

/*
Phones commonly suspend microphone/audio when the
browser becomes inactive.

Try to restore everything when the page comes back.
*/

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      await ensureAudioRunning();
    }
  }
);


/* ==========================================================
   WINDOW FOCUS SUPPORT
   ========================================================== */

window.addEventListener(
  "focus",
  async () => {

    await ensureAudioRunning();
  }
);


/* ==========================================================
   MOBILE TOUCH RECOVERY
   ========================================================== */

/*
Some versions of Safari won't resume audio after
leaving the browser until another interaction occurs.

Any later touch/click will attempt to wake audio back up.
*/

async function wakeAudio() {

  await ensureAudioRunning();
}


document.addEventListener(
  "touchstart",
  wakeAudio,
  {
    passive: true
  }
);


document.addEventListener(
  "pointerdown",
  wakeAudio,
  {
    passive: true
  }
);


/* ==========================================================
   MICROPHONE DISCONNECT DETECTION
   ========================================================== */

function monitorMicrophone() {

  if (!mediaStream)
    return;


  const tracks =
    mediaStream.getAudioTracks();


  for (
    const track of tracks
  ) {

    track.addEventListener(
      "ended",
      () => {

        console.warn(
          "Microphone disconnected."
        );

        running = false;

        startButton.classList.remove(
          "hidden"
        );

        startButton.disabled = false;

      }
    );
  }
}


/* ==========================================================
   START BUTTON EVENTS
   ========================================================== */

startButton.addEventListener(
  "click",
  async () => {

    await startSystem();

    monitorMicrophone();
  }
);


/*
Pointer event helps some touch devices.
The click listener remains the actual startup event.
*/

startButton.addEventListener(
  "pointerup",
  () => {},
  {
    passive: true
  }
);


/* ==========================================================
   GETUSERMEDIA SUPPORT CHECK
   ========================================================== */

if (
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
) {

  console.error(
    "Microphone access is not supported by this browser."
  );
}

</script>

</body>
</html>
