<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">

  <title></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #000 !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;

      overscroll-behavior: none;
      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #start {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: none;
      outline: none;

      appearance: none;
      -webkit-appearance: none;

      background: #000;
      color: transparent;

      cursor: pointer;
    }

    #start.hidden {
      display: none;
    }
  </style>
</head>

<body>

<button
  id="start"
  type="button"
  aria-label="Start microphone"
></button>

<script>
"use strict";


/* ==========================================================
   CONFIG
   ========================================================== */

const VOICE_FOLDER = "voice";


/*
   Detect quiet speech more easily.
*/

const MIN_VOICE_THRESHOLD = 0.008;


/*
   How much louder than the normal room noise
   something needs to be.
*/

const NOISE_MULTIPLIER = 1.9;


/*
   How long sound must remain voice-like.
*/

const REQUIRED_VOICE_TIME = 80;


/*
   Wait 2 seconds after detecting speech.
*/

const RESPONSE_DELAY = 2000;


/*
   Wait after a voice clip finishes before listening again.
*/

const AFTER_AUDIO_COOLDOWN = 1000;


/*
   Prevent rapid repeated triggers.
*/

const MIN_TRIGGER_GAP = 2500;


/*
   Controls how slowly the site learns background noise.
*/

const NOISE_SMOOTHING = 0.985;


/*
   Number of recent microphone readings averaged together.
*/

const VOLUME_HISTORY_SIZE = 8;


/*
   Optional manual GitHub information.

   Leave blank for normal GitHub Pages.
*/

const GITHUB_OWNER = "";

const GITHUB_REPO = "";


/* ==========================================================
   VARIABLES
   ========================================================== */

let voiceFiles = [];

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let mediaStream = null;

let dataArray = null;

let running = false;

let waitingToReply = false;

let voiceAudioPlaying = false;

let voiceStartedAt = null;

let lastTriggerTime = 0;

let currentAudio = null;

let previousVoiceIndex = -1;

let noiseFloor = 0.005;

let volumeHistory = [];

let detectionFrame = null;

const startButton =
  document.getElementById("start");


/* ==========================================================
   GITHUB REPO DETECTION
   ========================================================== */

function getGitHubInfo() {

  if (
    GITHUB_OWNER &&
    GITHUB_REPO
  ) {

    return {
      owner: GITHUB_OWNER,
      repo: GITHUB_REPO
    };
  }


  const hostname =
    window.location.hostname;


  if (
    hostname.endsWith(".github.io")
  ) {

    const owner =
      hostname.split(".")[0];


    const parts =
      window.location.pathname
        .split("/")
        .filter(Boolean);


    const repo =
      parts.length > 0
        ? parts[0]
        : owner + ".github.io";


    return {
      owner,
      repo
    };
  }


  return null;
}


/* ==========================================================
   LOAD ALL WAV FILES
   ========================================================== */

async function loadVoiceFiles() {

  const github =
    getGitHubInfo();


  if (!github) {

    console.warn(
      "Could not automatically detect GitHub repo."
    );

    return;
  }


  const apiURL =
    `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${VOICE_FOLDER}`;


  try {

    const response =
      await fetch(apiURL, {
        cache: "no-store"
      });


    if (!response.ok) {

      throw new Error(
        `GitHub API error ${response.status}`
      );
    }


    const files =
      await response.json();


    voiceFiles =
      files

        .filter(file => {

          return (
            file.type === "file" &&
            file.name
              .toLowerCase()
              .endsWith(".wav")
          );

        })

        .map(file => {

          return {
            name: file.name,
            url: file.download_url
          };

        });


    console.log(
      `Loaded ${voiceFiles.length} WAV files.`
    );


    console.log(
      voiceFiles.map(
        file => file.name
      )
    );

  }

  catch (error) {

    console.error(
      "Failed to load voice folder:",
      error
    );
  }
}


/* ==========================================================
   CREATE AUDIO CONTEXT
   ========================================================== */

function createAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContextClass) {

    return null;
  }


  return new AudioContextClass();
}


/* ==========================================================
   START
   ========================================================== */

async function startSystem() {

  startButton.disabled = true;


  try {

    await loadVoiceFiles();


    if (!audioContext) {

      audioContext =
        createAudioContext();
    }


    if (!audioContext) {

      throw new Error(
        "Web Audio API is unsupported."
      );
    }


    if (
      audioContext.state === "suspended"
    ) {

      await audioContext.resume();
    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Microphone access is unsupported."
      );
    }


    mediaStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          /*
             Disabled because it can sometimes remove
             quiet/distant speech.
          */

          noiseSuppression: false,

          autoGainControl: true,

          channelCount: 1,

          sampleRate: 48000

        },

        video: false
      });


    setupMicrophone();


    monitorMicrophone();


    running = true;


    startButton.classList.add(
      "hidden"
    );


    if (!detectionFrame) {

      detectionLoop();
    }


    console.log(
      "Microphone listener started."
    );

  }

  catch (error) {

    console.error(
      "Could not start:",
      error
    );


    startButton.disabled = false;
  }
}


/* ==========================================================
   MICROPHONE SETUP
   ========================================================== */

function setupMicrophone() {

  if (microphoneSource) {

    try {
      microphoneSource.disconnect();
    }
    catch (error) {}

  }


  microphoneSource =
    audioContext.createMediaStreamSource(
      mediaStream
    );


  analyser =
    audioContext.createAnalyser();


  /*
     Larger buffer helps quieter sound detection.
  */

  analyser.fftSize = 4096;


  analyser.smoothingTimeConstant =
    0.75;


  microphoneSource.connect(
    analyser
  );


  dataArray =
    new Uint8Array(
      analyser.fftSize
    );
}


/* ==========================================================
   GET MICROPHONE VOLUME
   ========================================================== */

function getMicrophoneVolume() {

  analyser.getByteTimeDomainData(
    dataArray
  );


  let total = 0;


  for (
    let i = 0;
    i < dataArray.length;
    i++
  ) {

    const sample =
      (dataArray[i] - 128) / 128;


    total +=
      sample * sample;
  }


  const rms =
    Math.sqrt(
      total / dataArray.length
    );


  volumeHistory.push(
    rms
  );


  if (
    volumeHistory.length >
    VOLUME_HISTORY_SIZE
  ) {

    volumeHistory.shift();
  }


  let average = 0;


  for (
    const value of volumeHistory
  ) {

    average += value;
  }


  average /=
    volumeHistory.length;


  return average;
}


/* ==========================================================
   BACKGROUND NOISE LEARNING
   ========================================================== */

function updateNoiseFloor(volume) {

  const probableSpeech =
    volume >
    Math.max(
      MIN_VOICE_THRESHOLD,
      noiseFloor * 2.4
    );


  /*
     Don't teach the background system using actual speech.
  */

  if (probableSpeech) {

    return;
  }


  noiseFloor =
    (
      noiseFloor *
      NOISE_SMOOTHING
    )
    +
    (
      volume *
      (1 - NOISE_SMOOTHING)
    );


  noiseFloor =
    Math.max(
      0.001,
      Math.min(
        noiseFloor,
        0.08
      )
    );
}


/* ==========================================================
   DYNAMIC SPEECH THRESHOLD
   ========================================================== */

function getVoiceThreshold() {

  return Math.max(
    MIN_VOICE_THRESHOLD,
    noiseFloor *
    NOISE_MULTIPLIER
  );
}


/* ==========================================================
   MAIN DETECTION LOOP
   ========================================================== */

function detectionLoop() {

  detectionFrame =
    requestAnimationFrame(
      detectionLoop
    );


  if (!running)
    return;


  if (!analyser)
    return;


  if (waitingToReply)
    return;


  if (voiceAudioPlaying)
    return;


  if (
    !audioContext ||
    audioContext.state !== "running"
  ) {

    return;
  }


  const volume =
    getMicrophoneVolume();


  updateNoiseFloor(
    volume
  );


  checkVoice(
    volume
  );
}


/* ==========================================================
   CHECK FOR SPEECH
   ========================================================== */

function checkVoice(volume) {

  const now =
    performance.now();


  if (
    now - lastTriggerTime <
    MIN_TRIGGER_GAP
  ) {

    voiceStartedAt = null;

    return;
  }


  const threshold =
    getVoiceThreshold();


  if (
    volume >= threshold
  ) {

    if (
      voiceStartedAt === null
    ) {

      voiceStartedAt =
        now;

      return;
    }


    const speakingTime =
      now - voiceStartedAt;


    if (
      speakingTime >=
      REQUIRED_VOICE_TIME
    ) {

      voiceStartedAt = null;


      voiceDetected();
    }

  }

  else {

    /*
       Allows tiny gaps inside speech.
    */

    if (
      voiceStartedAt !== null &&
      now - voiceStartedAt < 180
    ) {

      return;
    }


    voiceStartedAt = null;
  }
}


/* ==========================================================
   SPEECH DETECTED
   ========================================================== */

function voiceDetected() {

  if (waitingToReply)
    return;


  if (voiceAudioPlaying)
    return;


  waitingToReply =
    true;


  lastTriggerTime =
    performance.now();


  console.log(
    "Voice detected."
  );


  setTimeout(
    async () => {

      await ensureAudioRunning();


      playRandomVoice();

    },

    RESPONSE_DELAY
  );
}


/* ==========================================================
   RANDOM VOICE
   ========================================================== */

function getRandomVoice() {

  if (
    voiceFiles.length === 0
  ) {

    return null;
  }


  if (
    voiceFiles.length === 1
  ) {

    previousVoiceIndex =
      0;


    return voiceFiles[0];
  }


  let index;


  do {

    index =
      Math.floor(
        Math.random() *
        voiceFiles.length
      );

  }

  while (
    index ===
    previousVoiceIndex
  );


  previousVoiceIndex =
    index;


  return voiceFiles[index];
}


/* ==========================================================
   PLAY RANDOM WAV
   ========================================================== */

async function playRandomVoice() {

  const voice =
    getRandomVoice();


  if (!voice) {

    console.warn(
      "No WAV files were found."
    );


    resetDetection();

    return;
  }


  stopCurrentAudio();


  const audio =
    new Audio();


  currentAudio =
    audio;


  voiceAudioPlaying =
    true;


  audio.preload =
    "auto";


  audio.volume =
    1;


  audio.loop =
    false;


  audio.src =
    voice.url;


  console.log(
    "Playing:",
    voice.name
  );


  audio.addEventListener(
    "ended",
    audioFinished,
    {
      once: true
    }
  );


  audio.addEventListener(
    "error",
    audioFailed,
    {
      once: true
    }
  );


  try {

    const playResult =
      audio.play();


    if (
      playResult &&
      typeof playResult.then === "function"
    ) {

      await playResult;
    }

  }

  catch (error) {

    console.error(
      "Could not play WAV:",
      error
    );


    audioFailed();
  }
}


/* ==========================================================
   AUDIO FINISHED
   ========================================================== */

function audioFinished() {

  voiceAudioPlaying =
    false;


  currentAudio =
    null;


  setTimeout(
    resetDetection,
    AFTER_AUDIO_COOLDOWN
  );
}


/* ==========================================================
   AUDIO FAILED
   ========================================================== */

function audioFailed() {

  voiceAudioPlaying =
    false;


  currentAudio =
    null;


  setTimeout(
    resetDetection,
    500
  );
}


/* ==========================================================
   STOP AUDIO
   ========================================================== */

function stopCurrentAudio() {

  if (!currentAudio)
    return;


  try {

    currentAudio.pause();

    currentAudio.currentTime =
      0;

  }

  catch (error) {}


  currentAudio =
    null;


  voiceAudioPlaying =
    false;
}


/* ==========================================================
   RESET LISTENING
   ========================================================== */

function resetDetection() {

  waitingToReply =
    false;


  voiceStartedAt =
    null;


  lastTriggerTime =
    performance.now();
}


/* ==========================================================
   RESUME AUDIO
   ========================================================== */

async function ensureAudioRunning() {

  if (!audioContext)
    return;


  if (
    audioContext.state === "suspended"
  ) {

    try {

      await audioContext.resume();

    }

    catch (error) {

      console.warn(
        "Could not resume audio context."
      );
    }
  }
}


/* ==========================================================
   PHONE / TABLET TAB RECOVERY
   ========================================================== */

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      await ensureAudioRunning();
    }
  }
);


window.addEventListener(
  "focus",
  async () => {

    await ensureAudioRunning();
  }
);


document.addEventListener(
  "pointerdown",
  async () => {

    await ensureAudioRunning();
  },
  {
    passive: true
  }
);


document.addEventListener(
  "touchstart",
  async () => {

    await ensureAudioRunning();
  },
  {
    passive: true
  }
);


/* ==========================================================
   MICROPHONE DISCONNECT
   ========================================================== */

function monitorMicrophone() {

  if (!mediaStream)
    return;


  const tracks =
    mediaStream.getAudioTracks();


  for (
    const track of tracks
  ) {

    track.addEventListener(
      "ended",
      () => {

        console.warn(
          "Microphone stopped."
        );


        running =
          false;


        startButton.classList.remove(
          "hidden"
        );


        startButton.disabled =
          false;
      }
    );
  }
}


/* ==========================================================
   START BUTTON
   ========================================================== */

startButton.addEventListener(
  "click",
  startSystem
);


/* ==========================================================
   SUPPORT CHECK
   ========================================================== */

if (
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
) {

  console.error(
    "This browser does not support microphone access."
  );
}

</script>

</body>
</html>
