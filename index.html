<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta name="theme-color" content="#000000">

  <title></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #000 !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #start {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      outline: 0;

      appearance: none;
      -webkit-appearance: none;

      background: #000;
      color: transparent;

      cursor: pointer;
    }

    #start.hidden {
      display: none;
    }
  </style>
</head>

<body>

<button
  id="start"
  type="button"
  aria-label="Start"
></button>

<script>
"use strict";


/* ==========================================================
   SETTINGS
   ========================================================== */

const VOICE_FOLDER = "voice";

const VOICE_THRESHOLD = 0.03;

const REQUIRED_VOICE_TIME = 120;

const RESPONSE_DELAY = 2000;

const AFTER_AUDIO_COOLDOWN = 1200;

const MIN_TRIGGER_GAP = 3000;


/* ==========================================================
   OPTIONAL GITHUB SETTINGS
   ========================================================== */

/*
Usually you can leave these blank.

On a normal GitHub Pages URL like:

https://waa-4.github.io/myproject/

the script automatically works out:

owner = waa-4
repo  = myproject

If you're using a custom domain, fill these in.
*/

const GITHUB_OWNER = "";

const GITHUB_REPO = "";


/* ==========================================================
   VARIABLES
   ========================================================== */

let voiceFiles = [];

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let mediaStream = null;

let dataArray = null;

let running = false;

let waitingToReply = false;

let voiceAudioPlaying = false;

let voiceStartedAt = null;

let lastTriggerTime = 0;

let currentAudio = null;

let previousVoiceIndex = -1;

const startButton =
  document.getElementById("start");


/* ==========================================================
   FIND GITHUB REPOSITORY
   ========================================================== */

function getGitHubInfo() {

  /*
    Manual settings override automatic detection.
  */

  if (
    GITHUB_OWNER &&
    GITHUB_REPO
  ) {

    return {
      owner: GITHUB_OWNER,
      repo: GITHUB_REPO
    };
  }


  const hostname =
    window.location.hostname;


  /*
    Example:

    waa-4.github.io
  */

  if (
    hostname.endsWith(".github.io")
  ) {

    const owner =
      hostname.split(".")[0];


    /*
      Example:

      /thingsnderps/index.html

      becomes:

      thingsnderps
    */

    const parts =
      window.location.pathname
        .split("/")
        .filter(Boolean);


    /*
      User page:

      https://waa-4.github.io/

      has no repo path.

      Its repository would normally be:

      waa-4.github.io
    */

    const repo =
      parts.length > 0
        ? parts[0]
        : owner + ".github.io";


    return {
      owner,
      repo
    };
  }


  return null;
}


/* ==========================================================
   LOAD ALL WAV FILES AUTOMATICALLY
   ========================================================== */

async function loadVoiceFiles() {

  const github =
    getGitHubInfo();


  if (!github) {

    console.error(
      "Could not automatically determine GitHub repository."
    );

    return;
  }


  const apiURL =
    `https://api.github.com/repos/${github.owner}/${github.repo}/contents/${VOICE_FOLDER}`;


  try {

    const response =
      await fetch(apiURL);


    if (!response.ok) {

      throw new Error(
        "GitHub API returned " +
        response.status
      );
    }


    const files =
      await response.json();


    /*
      Automatically accept ANY filename
      ending in .wav.

      Examples:

      hi.wav
      screaming.wav
      banana explosion.wav
      182736128.wav
      AAAAAAAAA.wav

      all work.
    */

    voiceFiles =
      files

        .filter(file => {

          return (
            file.type === "file" &&
            file.name
              .toLowerCase()
              .endsWith(".wav")
          );

        })

        .map(file => {

          /*
            download_url gives us the direct
            raw WAV file.
          */

          return {
            name: file.name,
            url: file.download_url
          };

        });


    console.log(
      `Found ${voiceFiles.length} WAV files.`
    );


    console.log(
      voiceFiles.map(
        file => file.name
      )
    );

  }

  catch (error) {

    console.error(
      "Could not load voice folder:",
      error
    );

  }
}


/* ==========================================================
   AUDIO CONTEXT
   ========================================================== */

function createAudioContext() {

  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (!AudioContextClass) {

    return null;
  }


  return new AudioContextClass();
}


/* ==========================================================
   START
   ========================================================== */

async function startSystem() {

  startButton.disabled = true;


  try {

    /*
      Load the WAV list.
    */

    await loadVoiceFiles();


    if (
      voiceFiles.length === 0
    ) {

      console.warn(
        "No .wav files were found inside /voice/"
      );
    }


    if (!audioContext) {

      audioContext =
        createAudioContext();
    }


    if (!audioContext) {

      throw new Error(
        "Web Audio API unsupported"
      );
    }


    if (
      audioContext.state === "suspended"
    ) {

      await audioContext.resume();
    }


    mediaStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          noiseSuppression: true,

          autoGainControl: true,

          channelCount: 1

        },

        video: false

      });


    setupMicrophone();


    running = true;


    startButton.classList.add(
      "hidden"
    );


    detectionLoop();


    monitorMicrophone();


    console.log(
      "Listening."
    );

  }

  catch (error) {

    console.error(
      "Could not start:",
      error
    );


    startButton.disabled = false;
  }
}


/* ==========================================================
   MICROPHONE SETUP
   ========================================================== */

function setupMicrophone() {

  if (microphoneSource) {

    try {

      microphoneSource.disconnect();

    }

    catch (error) {}

  }


  microphoneSource =
    audioContext.createMediaStreamSource(
      mediaStream
    );


  analyser =
    audioContext.createAnalyser();


  analyser.fftSize = 2048;

  analyser.smoothingTimeConstant =
    0.65;


  microphoneSource.connect(
    analyser
  );


  dataArray =
    new Uint8Array(
      analyser.fftSize
    );
}


/* ==========================================================
   LISTENING LOOP
   ========================================================== */

function detectionLoop() {

  requestAnimationFrame(
    detectionLoop
  );


  if (!running)
    return;


  if (!analyser)
    return;


  if (waitingToReply)
    return;


  if (voiceAudioPlaying)
    return;


  if (
    !audioContext ||
    audioContext.state !== "running"
  ) {

    return;
  }


  analyser.getByteTimeDomainData(
    dataArray
  );


  let total = 0;


  for (
    let i = 0;
    i < dataArray.length;
    i++
  ) {

    const sample =
      (dataArray[i] - 128) / 128;


    total +=
      sample * sample;
  }


  const volume =
    Math.sqrt(
      total / dataArray.length
    );


  checkVoice(volume);
}


/* ==========================================================
   CHECK VOICE
   ========================================================== */

function checkVoice(volume) {

  const now =
    performance.now();


  if (
    now - lastTriggerTime <
    MIN_TRIGGER_GAP
  ) {

    voiceStartedAt = null;

    return;
  }


  if (
    volume >= VOICE_THRESHOLD
  ) {

    if (
      voiceStartedAt === null
    ) {

      voiceStartedAt = now;

      return;
    }


    if (
      now - voiceStartedAt >=
      REQUIRED_VOICE_TIME
    ) {

      voiceStartedAt = null;

      voiceDetected();

    }

  }

  else {

    voiceStartedAt = null;

  }
}


/* ==========================================================
   VOICE DETECTED
   ========================================================== */

function voiceDetected() {

  if (waitingToReply)
    return;


  if (voiceAudioPlaying)
    return;


  waitingToReply = true;

  lastTriggerTime =
    performance.now();


  setTimeout(
    async () => {

      await ensureAudioRunning();

      playRandomVoice();

    },

    RESPONSE_DELAY
  );
}


/* ==========================================================
   RANDOM WAV
   ========================================================== */

function getRandomVoice() {

  if (
    voiceFiles.length === 0
  ) {

    return null;
  }


  if (
    voiceFiles.length === 1
  ) {

    previousVoiceIndex = 0;

    return voiceFiles[0];
  }


  let index;


  do {

    index =
      Math.floor(
        Math.random() *
        voiceFiles.length
      );

  }

  while (
    index ===
    previousVoiceIndex
  );


  previousVoiceIndex =
    index;


  return voiceFiles[index];
}


/* ==========================================================
   PLAY RANDOM WAV
   ========================================================== */

async function playRandomVoice() {

  const voice =
    getRandomVoice();


  if (!voice) {

    console.warn(
      "No WAV files available."
    );

    resetDetection();

    return;
  }


  stopCurrentAudio();


  const audio =
    new Audio();


  currentAudio =
    audio;


  voiceAudioPlaying =
    true;


  audio.preload =
    "auto";


  audio.volume =
    1;


  audio.loop =
    false;


  audio.src =
    voice.url;


  console.log(
    "Playing:",
    voice.name
  );


  audio.addEventListener(
    "ended",
    audioFinished,
    {
      once: true
    }
  );


  audio.addEventListener(
    "error",
    audioFailed,
    {
      once: true
    }
  );


  try {

    await audio.play();

  }

  catch (error) {

    console.error(
      "Could not play WAV:",
      error
    );


    audioFailed();
  }
}


/* ==========================================================
   FINISH
   ========================================================== */

function audioFinished() {

  voiceAudioPlaying = false;

  currentAudio = null;


  setTimeout(
    resetDetection,
    AFTER_AUDIO_COOLDOWN
  );
}


function audioFailed() {

  voiceAudioPlaying = false;

  currentAudio = null;


  setTimeout(
    resetDetection,
    500
  );
}


/* ==========================================================
   RESET
   ========================================================== */

function resetDetection() {

  waitingToReply = false;

  voiceStartedAt = null;

  lastTriggerTime =
    performance.now();
}


/* ==========================================================
   STOP AUDIO
   ========================================================== */

function stopCurrentAudio() {

  if (!currentAudio)
    return;


  try {

    currentAudio.pause();

    currentAudio.currentTime = 0;

  }

  catch (error) {}


  currentAudio = null;

  voiceAudioPlaying = false;
}


/* ==========================================================
   RESUME MOBILE AUDIO
   ========================================================== */

async function ensureAudioRunning() {

  if (!audioContext)
    return;


  if (
    audioContext.state ===
    "suspended"
  ) {

    try {

      await audioContext.resume();

    }

    catch (error) {}

  }
}


/* ==========================================================
   TAB / PHONE RECOVERY
   ========================================================== */

document.addEventListener(
  "visibilitychange",
  async () => {

    if (
      document.visibilityState ===
      "visible"
    ) {

      await ensureAudioRunning();

    }
  }
);


window.addEventListener(
  "focus",
  ensureAudioRunning
);


document.addEventListener(
  "pointerdown",
  ensureAudioRunning,
  {
    passive: true
  }
);


document.addEventListener(
  "touchstart",
  ensureAudioRunning,
  {
    passive: true
  }
);


/* ==========================================================
   MICROPHONE DISCONNECT
   ========================================================== */

function monitorMicrophone() {

  if (!mediaStream)
    return;


  const tracks =
    mediaStream.getAudioTracks();


  for (
    const track of tracks
  ) {

    track.addEventListener(
      "ended",
      () => {

        running = false;


        startButton.classList.remove(
          "hidden"
        );


        startButton.disabled = false;

      }
    );
  }
}


/* ==========================================================
   START BUTTON
   ========================================================== */

startButton.addEventListener(
  "click",
  startSystem
);


/* ==========================================================
   SUPPORT CHECK
   ========================================================== */

if (
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
) {

  console.error(
    "This browser does not support microphone access."
  );
}

</script>

</body>
</html>
